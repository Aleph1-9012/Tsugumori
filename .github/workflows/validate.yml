name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 20
    env:
      TSUGUMORI_REQUIRE_INTEGRATION: "1"

    steps:
      - name: Install target-platform validation tools
        run: >-
          pacman -Syu --noconfirm --needed
          fish git hyprland kitty lua mpv python python-gobject python-pillow python-qrcode quickshell qt6-declarative
          qt6-shadertools ripgrep shellcheck xdg-utils

      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Run repository validation
        run: bash .github/checks/validate.sh
