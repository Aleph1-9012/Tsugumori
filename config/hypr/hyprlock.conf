# ═══════════════════════════════════════════════════════════════════
# Tsugumori emergency fallback lock
#
# The normal animated lock is config/quickshell/widgets/lockscreen.qml, using
# Quickshell's ext-session-lock-v1 surfaces and PamContext. Keep this Hyprlock
# configuration as an administrator fallback; its package also supplies the
# /etc/pam.d/hyprlock service used by the Quickshell lock. Hyprland still
# controls explicit restoration after any session-lock client crashes.
# Uses authentication syntax supported by packaged Hyprlock 0.9.x.
# ═══════════════════════════════════════════════════════════════════

general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = true
    text_trim          = true
    fail_timeout       = 2000
}

auth {
    pam:enabled = true
    pam:module  = hyprlock
}

# If this fallback client is launched and its image fails to load,
# immediate_render still presents an opaque fallback.
animations {
    enabled = true
    bezier = tsugumori, 0.4, 0, 0.2, 1
    animation = fadeIn, 1, 4, tsugumori
    animation = fadeOut, 1, 4, tsugumori
    animation = inputFieldColors, 1, 3, tsugumori
    animation = inputFieldDots, 1, 3, tsugumori
}

background {
    monitor     =
    path        = $XDG_CONFIG_HOME/hypr/lockbg.png
    color       = rgba(050608ff)
    blur_size   = 0
    blur_passes = 0
}

# Fallback authentication panel. Password bytes remain inside hyprlock/PAM.
input-field {
    monitor           =
    size              = 360, 44
    position          = 44, -238
    halign            = left
    valign            = top

    outline_thickness = 1
    rounding          = 0
    outer_color       = rgba(cc1515ff)
    inner_color       = rgba(090b0ff2)
    font_color        = rgba(e7e9ebff)
    font_family       = JetBrains Mono

    dots_size         = 0.25
    dots_spacing      = 0.20
    dots_center       = true
    dots_rounding     = 0
    fade_on_empty     = false
    placeholder_text  = <span foreground="##646a72">PASSWORD</span>
    check_color       = rgba(e7e9ebff)
    check_text        = VERIFYING…
    fail_color        = rgba(cc1515ff)
    fail_text         = <span foreground="##cc1515">$PAMFAIL · ATTEMPT $ATTEMPTS</span>
}

label {
    monitor       =
    text          = $USER
    color         = rgba(e7e9ebff)
    font_size     = 13
    font_family   = JetBrains Mono
    position      = 44, -195
    halign        = left
    valign        = top
    shadow_passes = 0
}

label {
    monitor       =
    text          = SECURE ACCESS // PAM
    color         = rgba(646a72ff)
    font_size     = 9
    font_family   = JetBrains Mono
    position      = 44, -300
    halign        = left
    valign        = top
    shadow_passes = 0
}

label {
    monitor       =
    text          = $TIME
    color         = rgba(e7e9ebff)
    font_size     = 46
    font_family   = JetBrains Mono
    position      = 44, -100
    halign        = left
    valign        = top
    shadow_passes = 0
}

label {
    monitor       =
    text          = cmd[update:60000] date '+%Y-%m-%d  //  %A'
    color         = rgba(646a72ff)
    font_size     = 9
    font_family   = JetBrains Mono
    position      = 44, -158
    halign        = left
    valign        = top
    shadow_passes = 0
}

label {
    monitor       =
    text          = TSUGUMORI // SECURE SESSION
    color         = rgba(e7e9ebee)
    font_size     = 11
    font_family   = JetBrains Mono
    position      = 44, -42
    halign        = left
    valign        = top
    shadow_passes = 0
}

label {
    monitor       =
    text          = EMERGENCY FALLBACK CLIENT
    color         = rgba(cc1515ff)
    font_size     = 9
    font_family   = JetBrains Mono
    position      = 44, -68
    halign        = left
    valign        = top
    shadow_passes = 0
}

label {
    monitor       =
    text          = ARCH LINUX // HYPRLAND // HYPRLOCK
    color         = rgba(646a72dd)
    font_size     = 9
    font_family   = JetBrains Mono
    position      = 44, 42
    halign        = left
    valign        = bottom
    shadow_passes = 0
}

label {
    monitor       =
    text          = SESSION LOCKED // $USER
    color         = rgba(646a72dd)
    font_size     = 9
    font_family   = JetBrains Mono
    position      = -44, 42
    halign        = right
    valign        = bottom
    shadow_passes = 0
}
