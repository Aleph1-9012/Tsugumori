# ═══════════════════════════════════════════════════════════════════
# Tsugumori fallback lock — NieR cassette futurism
#
# The normal animated lock is config/quickshell/widgets/lockscreen.qml, using
# Quickshell's ext-session-lock-v1 surfaces and PamContext. Keep this Hyprlock
# configuration as an administrator fallback; its package also supplies the
# /etc/pam.d/hyprlock service used by the Quickshell lock. Hyprland still
# controls explicit restoration after any session-lock client crashes.
# Uses authentication syntax supported by packaged Hyprlock 0.9.x.
# ═══════════════════════════════════════════════════════════════════

general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = true
    text_trim          = true
    fail_timeout       = 2000
}

auth {
    pam:enabled = true
    pam:module  = hyprlock
}

# If this fallback client is launched and its image fails to load,
# immediate_render still presents an opaque fallback.
animations {
    enabled = true
    bezier = nier, 0.4, 0, 0.2, 1
    animation = fadeIn, 1, 4, nier
    animation = fadeOut, 1, 4, nier
    animation = inputFieldColors, 1, 3, nier
    animation = inputFieldDots, 1, 3, nier
}

background {
    monitor     =
    path        = $XDG_CONFIG_HOME/hypr/lockbg.png
    color       = rgba(0b0906ff)
    blur_size   = 0
    blur_passes = 0
}

# Fallback authentication panel. Password bytes remain inside hyprlock/PAM.
input-field {
    monitor           =
    size              = 320, 42
    position          = 0, -92
    halign            = center
    valign            = center

    outline_thickness = 1
    rounding          = 0
    outer_color       = rgba(cc1515ff)
    inner_color       = rgba(111111e6)
    font_color        = rgba(e8e8e8ff)
    font_family       = Share Tech Mono

    dots_size         = 0.25
    dots_spacing      = 0.20
    dots_center       = true
    dots_rounding     = 0
    fade_on_empty     = false
    placeholder_text  = <span foreground="##7a7358"><i>mot de passe...</i></span>
    check_color       = rgba(c8b89aff)
    check_text        = AUTHENTIFICATION…
    fail_color        = rgba(cc1515ff)
    fail_text         = <span foreground="##cc1515">$PAMFAIL · TENTATIVE $ATTEMPTS</span>
}

label {
    monitor       =
    text          = $USER
    color         = rgba(e8e8e8ff)
    font_size     = 13
    font_family   = Share Tech Mono
    position      = 0, 80
    halign        = center
    valign        = center
    shadow_passes = 0
}

label {
    monitor       =
    text          = ユニット · アクティブ
    color         = rgba(7a7358ff)
    font_size     = 9
    font_family   = Noto Sans JP
    position      = 0, 60
    halign        = center
    valign        = center
    shadow_passes = 0
}

label {
    monitor       =
    text          = $TIME
    color         = rgba(e8e8e8ff)
    font_size     = 46
    font_family   = Share Tech Mono
    position      = 0, 12
    halign        = center
    valign        = center
    shadow_passes = 0
}

label {
    monitor       =
    text          = cmd[update:60000] date '+%Y / %m / %d'
    color         = rgba(7a7358ff)
    font_size     = 9
    font_family   = Share Tech Mono
    position      = 0, -20
    halign        = center
    valign        = center
    shadow_passes = 0
}

label {
    monitor       =
    text          = SESSION LOCKED · SECURE<br/>NODE · $USER
    color         = rgba(e8e8e8dd)
    font_size     = 9
    font_family   = Share Tech Mono
    position      = 30, -30
    halign        = left
    valign        = top
    shadow_passes = 0
}

label {
    monitor       =
    text          = $TIME
    color         = rgba(e8e8e8dd)
    font_size     = 9
    font_family   = Share Tech Mono
    position      = -30, -30
    halign        = right
    valign        = top
    shadow_passes = 0
}

label {
    monitor       =
    text          = ARCH LINUX · HYPRLAND
    color         = rgba(7a7358ff)
    font_size     = 9
    font_family   = Share Tech Mono
    position      = 30, 30
    halign        = left
    valign        = bottom
    shadow_passes = 0
}

label {
    monitor       =
    text          = SYSTEM SCAN · OK  ▸  SESSION LOCKED · SECURE  ▸  AUTH DAEMON · HYPRLOCK
    color         = rgba(7a7358cc)
    font_size     = 8
    font_family   = Share Tech Mono
    position      = 0, 50
    halign        = center
    valign        = bottom
    shadow_passes = 0
}
