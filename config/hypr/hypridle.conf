# Keep the session locked across suspend and after five idle minutes.
# loginctl's lock request invokes lock_cmd, while inhibit_sleep gives the
# Quickshell session-lock client time to acquire the compositor-enforced lock.
general {
    lock_cmd = ${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
