# ── NieR:Automata Terminal — Kitty Config ──

# Police
font_family      Share Tech Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Espacement
letter_spacing   0.5
line_height      1.2

# Palette sépia NieR
foreground            #e8e8e8
background            #0a0a0a
selection_foreground  #0a0a0a
selection_background  #e8e8e8

# Curseur
cursor                #cc1515
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_text_color     #0a0a0a
cursor_shape          block
cursor_blink_interval 0.8

# Couleurs ANSI — palette sépia/sombre
color0   #0a0a0a
color1   #cc1515
color2   #7a8faa
color3   #c8c8c4
color4   #7a8faa
color5   #9e1010
color6   #7a8faa
color7   #e8e8e8
color8   #2a2a2a
color9   #9e1010
color10  #7a8faa
color11  #c8c8c4
color12  #7a8faa
color13  #cc1515
color14  #909090
color15  #e8e8e8

# Fenêtre
window_padding_width     20
background_opacity       0.92
dynamic_background_color no

# Scrollback
scrollback_lines 5000

# Onglets — on les cache (sobre)
tab_bar_style hidden

# Pas de bell
enable_audio_bell no
visual_bell_duration 0.0

# Url
url_color   #7a8faa
url_style   single

# Titre fenêtre sobre
title_template "{title}"
